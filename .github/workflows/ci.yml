name: CI workflow

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop, 'feature/**' ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

env:
  PYTHON_VERSION: '3.11'
  CACHE_VERSION: v2

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - run: black --check src/ tests/
      - run: isort --check-only src/ tests/
      - run: flake8 src/ tests/
      - run: pylint src/log_filter/ || true
      - run: mypy src/log_filter/

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            scope: unit
          - os: ubuntu-latest
            python: '3.11'
            scope: unit
          - os: ubuntu-latest
            python: '3.12'
            scope: unit
          - os: windows-latest
            python: '3.11'
            scope: smoke
          - os: macos-latest
            python: '3.11'
            scope: smoke
          - os: ubuntu-latest
            python: '3.11'
            scope: integration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - if: matrix.scope == 'unit'
        run: pytest tests/unit/ -v --cov=log_filter --cov-report=xml

      - if: matrix.scope == 'integration'
        run: pytest tests/integration/ -v

      - if: matrix.scope == 'smoke'
        run: pytest tests/unit/ -q

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [ code-quality, test ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install build twine check-manifest

      - run: check-manifest
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: log-filter:test

      - run: docker run --rm log-filter:test log-filter --version

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: |
          pip install bandit pip-audit safety
          bandit -r src/ || true
          pip-audit || true
          safety check || true

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    needs: [ code-quality ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: |
          pip install -r requirements-dev.txt
          cd docs
          make html

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: |
          pip install pip-licenses
          pip install -r requirements.txt
          pip-licenses

  all-checks-pass:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - test
      - build
      - docker
      - security
      - documentation
    if: always()
    steps:
      - run: |
          for job in ${{ join(needs.*.result, ' ') }}; do
            if [ "$job" != "success" ]; then exit 1; fi
          done
